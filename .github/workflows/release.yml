name: Build and publish npm release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-assets:
    name: Verify and build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            cross: false
          - target: linux-arm64
            runner: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            cross: true
          - target: darwin-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            cross: false
          - target: darwin-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            cross: false
          - target: win32-x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            cross: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo test --manifest-path rust/caipira-ast/Cargo.toml
      - run: cargo build --release --manifest-path rust/caipira-ast/Cargo.toml
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm --prefix explore-ui ci --no-audit --no-fund
      - run: npm --prefix explore-ui run build
      - name: Cross-build Linux ARM64
        if: matrix.cross
        run: cross build --release --manifest-path rust/caipira-ast/Cargo.toml --target ${{ matrix.rust_target }}
      - name: Stage cross-built Linux ARM64 binary
        if: matrix.cross
        run: |
          mkdir -p artifact
          cp "rust/caipira-ast/target/${{ matrix.rust_target }}/release/caipira-ast" "artifact/caipira-ast-${{ matrix.target }}"
          chmod 755 "artifact/caipira-ast-${{ matrix.target }}"
      - name: Build target binary
        if: ${{ !matrix.cross && runner.os != 'Windows' }}
        run: |
          mkdir -p artifact
          cp rust/caipira-ast/target/release/caipira-ast "artifact/caipira-ast-${{ matrix.target }}"
          chmod 755 "artifact/caipira-ast-${{ matrix.target }}"
      - name: Build Windows target binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item rust/caipira-ast/target/release/caipira-ast.exe artifact/caipira-ast-${{ matrix.target }}.exe
      - name: Upload target binary
        uses: actions/upload-artifact@v7
        with:
          name: ast-${{ matrix.target }}
          path: artifact/caipira-ast-*
          if-no-files-found: error

  node-compatibility:
    name: Verify Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path rust/caipira-ast/Cargo.toml
      - run: npm ci --no-audit --no-fund
      - run: node -e "const Db = require('better-sqlite3'); const db = new Db(':memory:'); db.close();"
      - run: npm test

  publish:
    name: Assemble and publish scoped package
    runs-on: ubuntu-latest
    needs: [build-assets, node-compatibility]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: ast-*
          path: bin
          merge-multiple: true
      - name: Verify target binaries
        run: |
          set -eu
          for target in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            test -s "bin/caipira-ast-$target"
            chmod 755 "bin/caipira-ast-$target"
          done
          test -s bin/caipira-ast-win32-x64.exe
          test "$(find bin -maxdepth 1 -name 'caipira-ast-*' | wc -l)" -eq 5
      - name: Build Explore UI
        run: |
          npm --prefix explore-ui ci --no-audit --no-fund
          npm --prefix explore-ui run build
      - name: Download and verify local embedding model
        run: |
          set -eu
          model=models/Xenova/all-MiniLM-L6-v2
          revision=da5f6eac91a9596269707e15ec694e50e25a0d14
          mkdir -p "$model/onnx"
          for file in config.json tokenizer.json tokenizer_config.json special_tokens_map.json vocab.txt; do
            curl --fail --location --silent --show-error "https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/$revision/$file" -o "$model/$file"
          done
          curl --fail --location --silent --show-error "https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/$revision/onnx/model_quantized.onnx" -o "$model/onnx/model_quantized.onnx"
          echo 'afdb6f1a0e45b715d0bb9b11772f032c399babd23bfc31fed1c170afc848bdb1  models/Xenova/all-MiniLM-L6-v2/onnx/model_quantized.onnx' | sha256sum --check
      - name: Verify npm package contents
        run: |
          npm pack --dry-run --json > pack-manifest.json
          node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('pack-manifest.json','utf8')); const pack=Array.isArray(manifest)?manifest[0]:Object.values(manifest)[0]; if(!pack) throw new Error('npm pack returned an empty manifest'); const files=new Set(pack.files.map(file=>file.path)); const expected=['bin/caipira-cli.js','bin/caipira-ast-linux-x64','bin/caipira-ast-linux-arm64','bin/caipira-ast-darwin-arm64','bin/caipira-ast-darwin-x64','bin/caipira-ast-win32-x64.exe','caipira.sh','caipira.cmd','hooks/universal-hook.js','explore-ui/dist/index.html','models/Xenova/all-MiniLM-L6-v2/onnx/model_quantized.onnx']; const missing=expected.filter(file=>!files.has(file)); if(missing.length) throw new Error('npm pack omitted: '+missing.join(', ')); if([...files].some(file=>file.startsWith('rust/')||file.startsWith('test/')||file.includes('node_modules/'))) throw new Error('npm package includes development files');"
      - name: Verify tag matches package version
        run: |
          tag_version="v$(node -p 'require("./package.json").version')"
          test "$tag_version" = "$GITHUB_REF_NAME"
      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
