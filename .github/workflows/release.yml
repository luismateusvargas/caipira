name: Release

# Pushing an annotated vX.Y.Z tag builds and tests every target, publishes the
# npm package, then creates the GitHub release from the same tarball. The tag
# message becomes the release notes.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Verify tag matches package versions
        run: |
          set -eu
          for manifest in package.json runtime/package.json; do
            version="v$(node -p "require('./$manifest').version")"
            if [ "$version" != "$GITHUB_REF_NAME" ]; then
              echo "$manifest is $version but the tag is $GITHUB_REF_NAME" >&2
              exit 1
            fi
          done

  build-assets:
    name: Verify and build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            cross: true
          - target: linux-arm64
            runner: ubuntu-latest
            rust_target: aarch64-unknown-linux-musl
            cross: true
          - target: darwin-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            cross: false
          - target: darwin-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            cross: false
          - target: win32-x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            cross: false
    env:
      NODE_PATH: ${{ github.workspace }}/runtime/node_modules
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - run: cargo test --manifest-path rust/caipira-ast/Cargo.toml
      - run: cargo build --release --manifest-path rust/caipira-ast/Cargo.toml
      - run: npm --prefix runtime ci --omit=dev --no-audit --no-fund
      - run: npm test
      - run: npm --prefix explore-ui ci --no-audit --no-fund
      - run: npm --prefix explore-ui run build
      - name: Cross-build static Linux binary
        if: matrix.cross
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cross build --locked --release --manifest-path rust/caipira-ast/Cargo.toml --target ${{ matrix.rust_target }}
      - name: Reject dynamically linked Linux binaries
        if: matrix.cross
        shell: bash
        run: |
          set -euo pipefail
          binary="rust/caipira-ast/target/${{ matrix.rust_target }}/release/caipira-ast"
          headers="$(readelf --program-headers "$binary")"
          dynamic="$(readelf --dynamic "$binary")"
          if [[ "$headers" == *INTERP* || "$dynamic" == *'(NEEDED)'* ]]; then
            printf '%s\n' "Linux AST binary is dynamically linked: $binary" >&2
            exit 1
          fi
      - name: Stage static Linux binary
        if: matrix.cross
        run: |
          mkdir -p artifact
          cp "rust/caipira-ast/target/${{ matrix.rust_target }}/release/caipira-ast" "artifact/caipira-ast-${{ matrix.target }}"
          chmod 755 "artifact/caipira-ast-${{ matrix.target }}"
      - name: Build target binary
        if: ${{ !matrix.cross && runner.os != 'Windows' }}
        run: |
          mkdir -p artifact
          cp rust/caipira-ast/target/release/caipira-ast "artifact/caipira-ast-${{ matrix.target }}"
          chmod 755 "artifact/caipira-ast-${{ matrix.target }}"
      - name: Build Windows target binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item rust/caipira-ast/target/release/caipira-ast.exe artifact/caipira-ast-${{ matrix.target }}.exe
      - name: Upload target binary
        uses: actions/upload-artifact@v7
        with:
          name: ast-${{ matrix.target }}
          path: artifact/caipira-ast-*
          if-no-files-found: error

  node-runtime:
    name: Verify pinned Node 22 runtime
    needs: preflight
    runs-on: ubuntu-latest
    env:
      NODE_PATH: ${{ github.workspace }}/runtime/node_modules
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path rust/caipira-ast/Cargo.toml
      - run: npm --prefix runtime ci --omit=dev --no-audit --no-fund
      - run: node -e "const Db = require('better-sqlite3'); const db = new Db(':memory:'); db.close();"
      - run: npm test

  package:
    name: Assemble scoped package
    runs-on: ubuntu-latest
    needs: [build-assets, node-runtime]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - uses: actions/download-artifact@v8
        with:
          pattern: ast-*
          path: bin
          merge-multiple: true
      - name: Verify target binaries
        run: |
          set -eu
          for target in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            test -s "bin/caipira-ast-$target"
            chmod 755 "bin/caipira-ast-$target"
          done
          test -s bin/caipira-ast-win32-x64.exe
          test "$(find bin -maxdepth 1 -name 'caipira-ast-*' | wc -l)" -eq 5
      - name: Build Explore UI
        run: |
          npm --prefix explore-ui ci --no-audit --no-fund
          npm --prefix explore-ui run build
      - name: Download and verify local embedding model
        run: |
          set -eu
          model=models/Xenova/all-MiniLM-L6-v2
          revision=da5f6eac91a9596269707e15ec694e50e25a0d14
          mkdir -p "$model/onnx"
          for file in config.json tokenizer.json tokenizer_config.json special_tokens_map.json vocab.txt; do
            curl --fail --location --silent --show-error "https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/$revision/$file" -o "$model/$file"
          done
          curl --fail --location --silent --show-error "https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/$revision/onnx/model_quantized.onnx" -o "$model/onnx/model_quantized.onnx"
          echo 'afdb6f1a0e45b715d0bb9b11772f032c399babd23bfc31fed1c170afc848bdb1  models/Xenova/all-MiniLM-L6-v2/onnx/model_quantized.onnx' | sha256sum --check
      - name: Verify npm package contents
        run: |
          npm pack --dry-run --json > pack-manifest.json
          node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('pack-manifest.json','utf8')); const pack=Array.isArray(manifest)?manifest[0]:Object.values(manifest)[0]; if(!pack) throw new Error('npm pack returned an empty manifest'); const files=new Set(pack.files.map(file=>file.path)); const expected=['runtime.js','runtime/package.json','runtime/package-lock.json','bin/caipira-cli.js','bin/caipira-ast-linux-x64','bin/caipira-ast-linux-arm64','bin/caipira-ast-darwin-arm64','bin/caipira-ast-darwin-x64','bin/caipira-ast-win32-x64.exe','caipira.sh','caipira.cmd','hooks/universal-hook.js','explore-ui/dist/index.html','models/Xenova/all-MiniLM-L6-v2/onnx/model_quantized.onnx']; const missing=expected.filter(file=>!files.has(file)); if(missing.length) throw new Error('npm pack omitted: '+missing.join(', ')); if([...files].some(file=>file.startsWith('rust/')||file.startsWith('test/')||file.includes('node_modules/'))) throw new Error('npm package includes development files');"
      - name: Pack release files
        run: |
          set -eu
          mkdir release
          npm pack --pack-destination release
          test -s "release/luismateusvargas-caipira-${GITHUB_REF_NAME#v}.tgz"
          cp bin/caipira-ast-* release/
          (cd release && sha256sum -- * > SHA256SUMS)
      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Publish package
        run: npm publish "release/luismateusvargas-caipira-${GITHUB_REF_NAME#v}.tgz" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Read release notes from the annotated tag
        run: |
          set -eu
          # checkout stores the tag as lightweight; fetch the annotated object for its message.
          git fetch --force --no-tags origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > release-notes.md
          test -s release-notes.md
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Caipira $GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
